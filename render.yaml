services:
  - type: web
    name: virelo
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "3"
      - key: FILE_RETENTION_MINUTES
        value: "30"
      - key: DEFAULT_VIDEO_QUALITY
        value: "best"
      - key: DEFAULT_AUDIO_BITRATE
        value: "320"

