services:
  virelo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virelo
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./downloads:/app/downloads
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MAX_CONCURRENT_DOWNLOADS=3
      - DOWNLOADS_PATH=/app/downloads
      - DB_PATH=/app/data/virelo.db
