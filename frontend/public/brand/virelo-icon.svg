<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Left Ribbon Gradient -->
    <linearGradient id="virelo-left" x1="16" y1="28" x2="62" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>

    <!-- Right Ribbon Gradient -->
    <linearGradient id="virelo-right" x1="48" y1="88" x2="104" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="55%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bottom Fold Shadow & Gradient -->
    <linearGradient id="virelo-fold" x1="38" y1="65" x2="72" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <filter id="play-shadow" x="42" y="28" width="36" height="42" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Central Dark Notch Depth -->
  <path d="M52 46 L60 68 L68 50 Z" fill="#0E0E15" opacity="0.8" />

  <!-- Left Arm (Descending Ribbon) -->
  <path d="M16 28 C16 28 36 28 44 42 L56 70 C52 78 46 86 38 78 L26 48 C22 38 16 28 16 28 Z" fill="url(#virelo-left)" />

  <!-- Outer Sweeping V Structure -->
  <!-- Left to Bottom to Right -->
  <path d="M16 28 C26 28 38 34 46 50 L57 74 C59 78 63 80 67 76 L92 38 C96 32 101 30 106 30 L98 30 C90 30 84 36 78 46 L62 76 C58 84 50 84 46 76 L28 42 C24 34 20 30 16 28 Z" fill="url(#virelo-fold)" opacity="0.3" />

  <!-- Main Left Wing Ribbon -->
  <path d="M16 28 H34 C44 28 50 36 54 48 L46 78 C42 86 36 86 30 76 L16 28 Z" fill="url(#virelo-left)" />

  <!-- Right Wing Swoop Ribbon (Front Fold) -->
  <path d="M38 74 C44 88 54 94 66 94 C76 94 84 86 88 78 L104 38 C105 34 105 30 100 30 H86 C80 30 74 36 70 46 L58 74 C54 82 48 80 44 72 L38 74 Z" fill="url(#virelo-right)" />

  <!-- Bottom Accent Wrap -->
  <path d="M36 72 C42 88 52 94 62 94 C54 94 44 88 40 76 L36 72 Z" fill="#C084FC" opacity="0.6" />

  <!-- Embedded Play Button Icon -->
  <g filter="url(#play-shadow)">
    <!-- Play Triangle Container -->
    <path d="M52 35 C52 32.8 54.4 31.5 56.2 32.6 L69.5 41.2 C71.1 42.2 71.1 44.6 69.5 45.6 L56.2 54.2 C54.4 55.3 52 54 52 51.8 Z" fill="#14141B" stroke="#27272F" stroke-width="1.5" />
    <path d="M53.5 36.2 C53.5 34.6 55.3 33.6 56.7 34.5 L67.8 41.6 C69.1 42.4 69.1 44.4 67.8 45.2 L56.7 52.3 C55.3 53.2 53.5 52.2 53.5 50.6 Z" fill="#FFFFFF" />
  </g>
</svg>